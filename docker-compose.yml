version: "3"

services:
  zookeeper-jtsolv-avro-reg:
    image: confluentinc/cp-zookeeper:5.4.0
    hostname: zookeeper-jtsolv-avro-reg
    container_name: zookeeper-jtsolv-avro-reg
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker-jtsolv-avro-reg:
    image: confluentinc/cp-server:5.4.0
    hostname: broker-jtsolv-avro-reg
    container_name: broker-jtsolv-avro-reg
    depends_on:
      - zookeeper-jtsolv-avro-reg
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper-jtsolv-avro-reg:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-jtsolv-avro-reg:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker-jtsolv-avro-reg:29092
      CONFLUENT_METRICS_REPORTER_ZOOKEEPER_CONNECT: zookeeper-jtsolv-avro-reg:2181
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: "true"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"

  kafka-tools-jtsolv-avro-reg:
    image: confluentinc/cp-kafka:5.4.0
    hostname: kafka-tools-jtsolv-avro-reg
    container_name: kafka-tools-jtsolv-avro-reg
    command: ["tail", "-f", "/dev/null"]
    network_mode: "host"

  schema-registry-jtsolv-avro-reg:
    image: confluentinc/cp-schema-registry:5.4.0
    hostname: schema-registry-jtsolv-avro-reg
    container_name: schema-registry-jtsolv-avro-reg
    depends_on:
      - zookeeper-jtsolv-avro-reg
      - broker-jtsolv-avro-reg
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry-jtsolv-avro-reg
      SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: "zookeeper-jtsolv-avro-reg:2181"

  control-center-jtsolv-avro-reg:
    image: confluentinc/cp-enterprise-control-center:5.4.0
    hostname: control-center-jtsolv-avro-reg
    container_name: control-center-jtsolv-avro-reg
    depends_on:
      - zookeeper-jtsolv-avro-reg
      - broker-jtsolv-avro-reg
      - schema-registry-jtsolv-avro-reg
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker-jtsolv-avro-reg:29092'
      CONTROL_CENTER_ZOOKEEPER_CONNECT: 'zookeeper-jtsolv-avro-reg:2181'
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry-jtsolv-avro-reg:8081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  kafka-create-topics-jtsolv-avro-reg:
    image: confluentinc/cp-enterprise-kafka:6.0.0
    depends_on:
      - kafka-jtsolv-avro-reg
    hostname: kafka-create-topics-jtsolv-avro-reg
    command: ["bash", "./create-topics.sh"]
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts

  # KSQL server
  ksql-server-jtsolv-avro-reg:
    image: confluentinc/cp-ksql-server:latest
    environment:
      KSQL_KSQL_SERVICE_ID: default_ksql
      KSQL_LISTENER: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: kafka-jtsolv-avro-reg:9092
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry-jtsolv-avro-reg:8081
      KSQL_KSQL_SINK_REPLICATION_FACTOR: 1
      KSQL_KSQL_INTERNAL_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "8088:8088"
    depends_on:
      - kafka-jtsolv-avro-reg
      - schema-registry-jtsolv-avro-reg
      -
  # Avro producer for testing
  avro-producer-jtsolv-avro-reg:
    image: confluentinc/cp-kafka-avro-console-producer:latest
    command: >
      bash -c "echo '{\"name\":\"test\",\"age\":30}' | kafka-avro-console-producer --broker-list kafka:9092 --topic test-avro --property value.schema='{\"type\":\"record\",\"name\":\"user\",\"fields\":[{\"name\":\"name\",\"type\":\"string\"},{\"name\":\"age\",\"type\":\"int\"}]}'"
    depends_on:
      - kafka-jtsolv-avro-reg
      - schema-registry-jtsolv-avro-reg

  # Avro consumer for testing
  avro-consumer-jtsolv-avro-reg:
    image: confluentinc/cp-kafka-avro-console-consumer:latest
    command: >
      bash -c "kafka-avro-console-consumer --topic test-avro --bootstrap-server kafka:9092 --from-beginning --property schema.registry.url=http://schema-registry:8081"
    depends_on:
      - kafka-jtsolv-avro-reg
      - schema-registry-jtsolv-avro-reg
